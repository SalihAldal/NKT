# NKT VPS Deployment Package — Docker Compose
# Usage: docker compose --env-file .env.production up -d

name: nkt-production

x-server-env: &server-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@nkt-postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=${DB_POOL_SIZE:-8}
  REDIS_URL: redis://:${REDIS_PASSWORD}@nkt-redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  CORS_ORIGINS: ${CORS_ORIGINS}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
  APPLE_SHARED_SECRET: ${APPLE_SHARED_SECRET:-}
  APPLE_WEBHOOK_SECRET: ${APPLE_WEBHOOK_SECRET:-}
  GOOGLE_WEBHOOK_SECRET: ${GOOGLE_WEBHOOK_SECRET:-}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
  IMAGE_TAG: ${IMAGE_TAG:-latest}
  GIT_SHA: ${GIT_SHA:-unknown}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
  RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
  AI_MAX_BATCH_SIZE: ${AI_MAX_BATCH_SIZE:-25}
  AI_RATE_LIMIT_PER_HOUR: ${AI_RATE_LIMIT_PER_HOUR:-3}
  USE_MOCK_PAYMENT: ${USE_MOCK_PAYMENT:-false}
  GRACE_PERIOD_DAYS: ${GRACE_PERIOD_DAYS:-3}
  ALLOW_CONTENT_IMPORT: ${ALLOW_CONTENT_IMPORT:-false}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nkt-postgres:
    image: postgres:16-alpine
    container_name: nkt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      - nkt_pg_data:/var/lib/postgresql/data
      - ./deployment/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nkt-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-0.75}"
          memory: ${POSTGRES_MEM_LIMIT:-768M}
    logging: *default-logging

  nkt-redis:
    image: redis:7-alpine
    container_name: nkt-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-192mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - nkt_redis_data:/data
    networks:
      - nkt-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-0.25}"
          memory: ${REDIS_MEM_LIMIT:-256M}
    logging: *default-logging

  nkt-api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.server
    image: nkt-server:${IMAGE_TAG:-latest}
    container_name: nkt-api
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *server-env
      SERVICE_ROLE: api
      PORT: 3000
      HOST: 0.0.0.0
    volumes:
      - nkt_storage:/app/storage
    networks:
      - nkt-internal
    depends_on:
      nkt-postgres:
        condition: service_healthy
      nkt-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-0.75}"
          memory: ${API_MEM_LIMIT:-512M}
    logging: *default-logging

  nkt-realtime:
    image: nkt-server:${IMAGE_TAG:-latest}
    container_name: nkt-realtime
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *server-env
      SERVICE_ROLE: realtime
      REALTIME_PORT: 3001
      HOST: 0.0.0.0
    networks:
      - nkt-internal
    depends_on:
      nkt-postgres:
        condition: service_healthy
      nkt-redis:
        condition: service_healthy
      nkt-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${REALTIME_CPU_LIMIT:-0.5}"
          memory: ${REALTIME_MEM_LIMIT:-384M}
    logging: *default-logging

  nkt-worker:
    image: nkt-server:${IMAGE_TAG:-latest}
    container_name: nkt-worker
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *server-env
      SERVICE_ROLE: worker
      WORKER_HEALTH_PORT: 3002
      HOST: 0.0.0.0
    volumes:
      - nkt_storage:/app/storage
    networks:
      - nkt-internal
    depends_on:
      nkt-postgres:
        condition: service_healthy
      nkt-redis:
        condition: service_healthy
      nkt-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-0.5}"
          memory: ${WORKER_MEM_LIMIT:-512M}
    logging: *default-logging

  nkt-admin:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.admin
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_ADMIN_USE_MOCK: "false"
    image: nkt-admin:${IMAGE_TAG:-latest}
    container_name: nkt-admin
    restart: unless-stopped
    networks:
      - nkt-internal
    depends_on:
      nkt-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "${ADMIN_CPU_LIMIT:-0.25}"
          memory: ${ADMIN_MEM_LIMIT:-192M}
    logging: *default-logging

  nkt-nginx:
    image: nginx:1.27-alpine
    container_name: nkt-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./deployment/nginx/conf.d/generated:/etc/nginx/conf.d:ro
      - ./deployment/nginx/snippets:/etc/nginx/snippets:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
      - ./deployment/nginx/certbot:/var/www/certbot:ro
    networks:
      - nkt-internal
    depends_on:
      nkt-api:
        condition: service_healthy
      nkt-realtime:
        condition: service_healthy
      nkt-admin:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${NGINX_CPU_LIMIT:-0.25}"
          memory: ${NGINX_MEM_LIMIT:-192M}
    logging: *default-logging

networks:
  nkt-internal:
    name: nkt-internal
    driver: bridge

volumes:
  nkt_pg_data:
    name: nkt_pg_data
  nkt_redis_data:
    name: nkt_redis_data
  nkt_storage:
    name: nkt_storage
  nkt_backups:
    name: nkt_backups
